<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Gastos</title>
  
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Gastos">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Cargando Control de Gastos...</div>
  </div>

  <iframe 
    id="appFrame"
    allow="fullscreen; clipboard-read; clipboard-write"
    sandbox="allow-top-navigation allow-scripts allow-forms allow-same-origin allow-popups allow-modals"
    onload="onFrameLoad()">
  </iframe>

  <script>
    const searchParams = new URLSearchParams(window.location.search);
    const isDemo = searchParams.get('demo') === '1' || searchParams.get('demo') === 'true' || searchParams.get('modo') === 'demo' || window.location.hash.includes('demo=1');
    const baseExecUrl = "https://script.google.com/macros/s/AKfycbwJWqgtCPiPIYE78OxkXPwIiUn3eZhci-IF2NVTA5WuXwDXkedsZReVr_mfhi1E5_is/exec";
    const cacheBust = 'v=77_' + Date.now();
    const frameUrl = isDemo ? (baseExecUrl + "?demo=1&" + cacheBust + "#demo=1") : (baseExecUrl + "?" + cacheBust);

    const frame = document.getElementById('appFrame');
    if (frame) {
      frame.src = frameUrl;
    }

    function onFrameLoad() {
      hideLoader();
      if (isDemo && frame && frame.contentWindow) {
        try {
          frame.contentWindow.postMessage({ type: 'SET_DEMO_MODE', isDemo: true }, '*');
        } catch(e) {}
      }
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        setTimeout(() => loader.classList.add('hidden'), 300);
      }
    }
    // Timeout de seguridad para ocultar spinner en caso de delay
    setTimeout(hideLoader, 3500);

    // Ajustar vista en rotación de pantalla
    function handleResize() {
      window.scrollTo(0, 0);
      const frame = document.getElementById('appFrame');
      if (frame && frame.contentWindow) {
        try {
          frame.contentWindow.postMessage({ type: 'ORIENTATION_CHANGE', width: window.innerWidth, height: window.innerHeight }, '*');
        } catch(e) {}
      }
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleResize, 100);
      setTimeout(handleResize, 300);
    });

    // Escuchar forzado de recarga desde el iframe
    window.addEventListener('message', function(e) {
      if (e && e.data && e.data.type === 'FORCE_RELOAD') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
        }
        setTimeout(() => {
          window.location.reload(true);
        }, 200);
      }
    });

    // Registrar Service Worker para PWA sin caché de sw.js
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=77', { updateViaCache: 'none' }).then(reg => {
        reg.update();
      }).catch(err => {
        console.log('SW registration error:', err);
      });
    }
  </script>
</body>
</html>
